name: Deploy

on:
  push:
    branches:
      - release

env:
  DEPLOY_HOST: 46.23.96.145
  DEPLOY_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build image
        run: docker build -t borec-front:latest .

      - name: Upload image to server
        run: docker save borec-front:latest | gzip | ssh "$DEPLOY_USER@$DEPLOY_HOST" "gunzip | docker load"

      - name: Restart container
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            docker rm -f borec-front || true
            docker run -d --name borec-front --restart unless-stopped -p 80:80 borec-front:latest
            docker image prune -f
          "
